[theme]
base = "light"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"
font = "sans serif"

[client]
# Hide the Streamlit hamburger/Deploy toolbar so it reads as an app window.
toolbarMode = "minimal"

[server]
# run.py owns the window; Streamlit must never open a browser itself.
headless = true

[browser]
gatherUsageStats = false
