[theme]
base = "light"
backgroundColor = "#f9f9f7"       # neutral page plane
secondaryBackgroundColor = "#fcfcfb"  # cards, sidebar, chart surface
textColor = "#0b0b0b"
primaryColor = "#2a78d6"          # blue accent for controls -- matches the chart hue
font = "sans serif"

[client]
# Hide the Streamlit hamburger/Deploy toolbar so it reads as an app window.
toolbarMode = "minimal"

[server]
# run.py owns the window; Streamlit must never open a browser itself.
headless = true

[browser]
gatherUsageStats = false
