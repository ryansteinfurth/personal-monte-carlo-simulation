[theme]
base = "light"
backgroundColor = "#f7f0e2"       # warm cream page plane
secondaryBackgroundColor = "#fdfaf3"  # cards, sidebar, chart surface
textColor = "#0b0b0b"
primaryColor = "#ec5f9b"          # pink accent for controls -- never used for data
font = "sans serif"

[client]
# Hide the Streamlit hamburger/Deploy toolbar so it reads as an app window.
toolbarMode = "minimal"

[server]
# run.py owns the window; Streamlit must never open a browser itself.
headless = true

[browser]
gatherUsageStats = false
